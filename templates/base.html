<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mi app de prueba{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="barra">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" width="40" height="40">
    <span class="marca">Mi app de prueba</span>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">Flask + HTML + CSS + imágenes + base de datos</footer>
</body>
</html>
